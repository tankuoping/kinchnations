name: Update Kinch data

on:
  schedule:
    - cron: "0 23 * * *"   # 07:00 SGT
    - cron: "0 11 * * *"   # 19:00 SGT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build kinch data
        run: python scripts/build_kinch.py

      - name: Commit and push
        run: |
          git config user.name "kinch-bot"
          git config user.email "kinch-bot@users.noreply.github.com"
          git add data/kinch.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update kinch data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
